site_name: DLTNG Upgrade
site_description: DLTNG Upgrade — portable Windows wizard / portabler Windows-Assistent
repo_url: https://github.com/harzmann/dlt_upgarde_docs
repo_name: dlt_upgarde_docs
edit_uri: ''
theme:
  name: material
  font: false
  icon:
    logo: material/chip
  palette:
    scheme: default
    primary: teal
    accent: cyan
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - search.suggest
plugins:
  - search
hooks:
  - hooks.py
extra_css:
  - assets/style.css
extra:
  alternate:
    - name: Deutsch
      lang: de
      link: https://harzmann.github.io/dlt_upgarde_docs/de/
    - name: English
      lang: en
      link: https://harzmann.github.io/dlt_upgarde_docs/en/
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
